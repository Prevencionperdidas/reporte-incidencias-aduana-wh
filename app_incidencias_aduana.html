<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Reporte Incidencias Aduana - PPS IKEA</title>
<style>
  :root{
    --ikea-blue:#0058A3;
    --ikea-blue-dark:#003D73;
    --ikea-yellow:#FFDA1A;
    --ok:#2E7D32;
    --warn:#E67E00;
    --err:#C62828;
    --bg:#F2F2F2;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  body{margin:0;font-family:'Noto Sans',Arial,sans-serif;background:var(--bg);color:#111;padding-bottom:40px;}
  header{background:var(--ikea-blue);color:#fff;padding:14px 16px;display:flex;align-items:center;gap:14px;}
  header img.logo-img{width:52px;height:52px;border-radius:8px;background:#fff;padding:3px;flex-shrink:0;object-fit:contain;}
  header .titles{display:flex;flex-direction:column;line-height:1.3;}
  header h1{font-size:15px;margin:0;font-weight:700;}
  header .subtitle{font-size:12px;font-weight:600;color:var(--ikea-yellow);letter-spacing:.3px;}
  header .sync{margin-left:auto;font-size:11px;background:rgba(255,255,255,.15);padding:4px 8px;border-radius:12px;white-space:nowrap;align-self:flex-start;}
  .container{padding:12px;max-width:520px;margin:0 auto;}

  .card{background:#fff;border-radius:10px;padding:14px;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.08);}

  .btn{display:block;width:100%;padding:14px;border:none;border-radius:8px;font-size:16px;font-weight:700;cursor:pointer;margin-top:10px;}
  .btn-primary{background:var(--ikea-blue);color:#fff;}
  .btn-primary:active{background:var(--ikea-blue-dark);}
  .btn-yellow{background:var(--ikea-yellow);color:var(--ikea-blue-dark);}
  .btn-secondary{background:#eee;color:#333;}
  .btn:disabled{opacity:.5;}

  label{display:block;font-size:11px;font-weight:700;color:#555;margin-top:10px;text-transform:uppercase;letter-spacing:.3px;}
  input[type=text], input[type=number], select{width:100%;padding:12px;margin-top:4px;border:1px solid #ccc;border-radius:6px;font-size:16px;text-transform:uppercase;background:#fff;}
  select{-webkit-appearance:none;appearance:none;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 20 20' fill='%23555'><path d='M5 7l5 5 5-5z'/></svg>");background-repeat:no-repeat;background-position:right 12px center;}

  .field-required label::after{content:" *";color:var(--err);}

  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}

  .badge{display:inline-block;font-size:11px;font-weight:700;padding:3px 8px;border-radius:10px;margin-left:6px;}
  .badge-pend{background:#FFEBEE;color:var(--err);}
  .badge-ok{background:#E3F2FD;color:var(--ikea-blue);}
  .badge-err{background:#FCE4E4;color:var(--err);}

  h2{font-size:14px;margin:0 0 8px 0;color:var(--ikea-blue-dark);}

  .hist-item{border-bottom:1px solid #eee;padding:10px 0;}
  .hist-item:last-child{border-bottom:none;}
  .hist-top{display:flex;justify-content:space-between;align-items:center;font-weight:700;font-size:14px;gap:6px;flex-wrap:wrap;}
  .hist-sub{font-size:12px;color:#777;margin-top:2px;}
  .hist-error{font-size:12px;color:var(--err);font-weight:700;margin-top:2px;}

  .pin-modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;z-index:100;}
  .pin-modal.show{display:flex;}
  .pin-box{background:#fff;border-radius:10px;padding:20px;width:280px;}
  .toast{position:fixed;top:70px;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:8px;font-size:13px;z-index:200;opacity:0;transition:opacity .3s;pointer-events:none;max-width:90%;text-align:center;}
  .toast.show{opacity:1;}
</style>
</head>

  <div class="titles">

  <div class="card">

        <option value="">-- Selecciona --</option>

        <option>CARTONES SIN PEGAR</option>
        <option>ESTIVA INCORRECTA</option>
        <option>LPN ENVIADO</option>
        <option>LPN IMPRESO</option>
        <option>LPN INVERTIDO</option>
        <option>LPN NO CORRESPONDE</option>
        <option>PALLET MEZCLADO</option>
        <option>PRODUCTO DAÑADO</option>
        <option>PRODUCTO FALTANTE</option>
        <option>PRODUCTO SOBRANTE</option>
      </select>
    </div>

    <div class="grid2">
      <div class="field-required"><label>SKU</label><input type="text" id="fSku" placeholder="Ej: 00123456"></div>
      <div class="field-required"><label>Cantidad SKU</label><input type="number" id="fCantidad" min="1" step="1" inputmode="numeric" style="text-transform:none;"></div>
    </div>

    <button class="btn btn-yellow" id="btnSave">Guardar incidencia</button>
    <button class="btn btn-secondary" id="btnClearForm">Limpiar formulario</button>

    <h2>Últimas incidencias (<span id="histCount">0</span>)</h2>
    <div id="histList"><div style="color:#999;font-size:13px;">Sin registros aún.</div></div>
  </div>

  <div class="card">
    <h2>Administración</h2>
    <button class="btn btn-secondary" id="btnExport">Exportar CSV local</button>
    <button class="btn btn-secondary" id="btnClear">Borrar historial local (PIN)</button>
  </div>

</div>

<div class="pin-modal" id="pinModal">
  <div class="pin-box">
    <h3 style="margin-top:0;">Ingresa PIN</h3>
    <input type="password" id="pinInput" inputmode="numeric" maxlength="6" style="width:100%;padding:10px;font-size:18px;text-align:center;letter-spacing:4px;border:1px solid #ccc;border-radius:6px;">
    <button class="btn btn-primary" id="pinConfirm">Confirmar</button>
    <button class="btn btn-secondary" id="pinCancel">Cancelar</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ============ CONFIG ============
const ADMIN_PIN = "358097";
// Reemplaza esta URL por la de tu Web App de Apps Script una vez desplegada
const GAS_URL = "https://script.google.com/macros/s/AKfycbyn2JbKYE9BK_lkvh95DwK-Ylfdta7VgAlwYR2NvfuVJx9Gdlb8PwTWb4xAd0J0hPOC/exec";
const STORAGE_KEY = "incidencias_aduana_v2";
const QUEUE_KEY = "incidencias_aduana_queue_v2";

// ============ UTILIDADES DE ALMACENAMIENTO ============
function getRecords(){
  return JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
}
function saveRecords(arr){
  localStorage.setItem(STORAGE_KEY, JSON.stringify(arr));
}
function getQueue(){
  return JSON.parse(localStorage.getItem(QUEUE_KEY) || "[]");
}
function saveQueue(arr){
  localStorage.setItem(QUEUE_KEY, JSON.stringify(arr));
  updateSyncBadge();
}
function updateSyncBadge(){
  const n = getQueue().length;
  document.getElementById('syncStatus').textContent = n === 0 ? "Sincronizado" : (n + " pend.");
}

function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2400);
}

// ============ GUARDAR INCIDENCIA ============
function saveRecord(){
  const olpn = document.getElementById('fOlpn').value.trim().toUpperCase();
  const tipoError = document.getElementById('fTipoError').value;
  const sku = document.getElementById('fSku').value.trim().toUpperCase();
  const cantidad = document.getElementById('fCantidad').value.trim();

  if(!olpn){
    toast("Ingresa el OLPN");
    document.getElementById('fOlpn').focus();
    return;
  }
  if(!tipoError){
    toast("Selecciona el tipo de error");
    document.getElementById('fTipoError').focus();
    return;
  }
  if(!sku){
    toast("Ingresa el SKU");
    document.getElementById('fSku').focus();
    return;
  }
  if(!cantidad || Number(cantidad) <= 0){
    toast("Ingresa una cantidad válida");
    document.getElementById('fCantidad').focus();
    return;
  }

  const rec = {
    id: 'inc_' + Date.now() + '_' + Math.random().toString(36).slice(2,7),
    OLPN: olpn,
    tipoError: tipoError,
    sku: sku,
    cantidad: Number(cantidad),
    timestamp: new Date().toISOString(),
    turno: getTurno(),
    synced: false
  };

  const records = getRecords();
  records.unshift(rec);
  saveRecords(records);

  const queue = getQueue();
  queue.push(rec);
  saveQueue(queue);

  toast("Incidencia guardada");
  clearForm();
  renderHistory();
  trySync();
}

function clearForm(){
  document.getElementById('fOlpn').value = '';
  document.getElementById('fTipoError').value = '';
  document.getElementById('fSku').value = '';
  document.getElementById('fCantidad').value = '';
  document.getElementById('fOlpn').focus();
}

function getTurno(){
  const h = new Date().getHours();
  if(h>=6 && h<14) return "MAÑANA";
  if(h>=14 && h<22) return "TARDE";
  return "NOCHE";
}

// ============ HISTORIAL ============
function renderHistory(){
  const records = getRecords();
  document.getElementById('histCount').textContent = records.length;
  const list = document.getElementById('histList');
  if(records.length === 0){
    list.innerHTML = '<div style="color:#999;font-size:13px;">Sin registros aún.</div>';
    return;
  }
  list.innerHTML = records.slice(0,20).map(r=>{
    const badge = r.synced
      ? '<span class="badge badge-ok">OK</span>'
      : '<span class="badge badge-pend">PEND</span>';
    const d = new Date(r.timestamp);
    return `<div class="hist-item">
      <div class="hist-top">${r.OLPN || '(sin OLPN)'} ${badge}</div>
      <div class="hist-error">${r.tipoError}</div>
      <div class="hist-sub">SKU ${r.sku} · Cant. ${r.cantidad} · ${r.turno} · ${d.toLocaleString('es-CL')}</div>
    </div>`;
  }).join('');
}

// ============ SINCRONIZACIÓN (JSONP GET / no-cors POST) ============
function trySync(){
  const queue = getQueue();
  if(queue.length === 0 || GAS_URL.includes("PON_AQUI")) return;

  const pending = [...queue];
  pending.forEach(rec=>{
    fetch(GAS_URL, {
      method: 'POST',
      mode: 'no-cors',
      headers: {'Content-Type':'text/plain'},
      body: JSON.stringify(rec)
    }).then(()=>{
      markSynced(rec.id);
    }).catch(()=>{ /* se reintenta en el próximo trySync */ });
  });
}

function markSynced(id){
  const records = getRecords().map(r => r.id === id ? {...r, synced:true} : r);
  saveRecords(records);
  const queue = getQueue().filter(r => r.id !== id);
  saveQueue(queue);
  renderHistory();
}

setInterval(trySync, 20000);
window.addEventListener('online', trySync);

// ============ EXPORTAR / BORRAR (PIN) ============
function exportCSV(){
  const records = getRecords();
  if(records.length===0){ toast("No hay registros para exportar"); return; }
  const headers = ["OLPN","tipoError","sku","cantidad","turno","timestamp","synced"];
  const rows = records.map(r => headers.map(h => `"${(r[h]??'').toString().replace(/"/g,'""')}"`).join(","));
  const csv = headers.join(",") + "\n" + rows.join("\n");
  const blob = new Blob([csv], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `incidencias_aduana_${new Date().toISOString().slice(0,10)}.csv`;
  a.click();
}

let pinAction = null;
function askPin(action){
  pinAction = action;
  document.getElementById('pinInput').value = '';
  document.getElementById('pinModal').classList.add('show');
}
function confirmPin(){
  const val = document.getElementById('pinInput').value;
  document.getElementById('pinModal').classList.remove('show');
  if(val !== ADMIN_PIN){
    toast("PIN incorrecto");
    return;
  }
  if(pinAction === 'clear'){
    localStorage.removeItem(STORAGE_KEY);
    localStorage.removeItem(QUEUE_KEY);
    renderHistory();
    updateSyncBadge();
    toast("Historial local borrado");
  }
}

// ============ EVENTOS ============
document.getElementById('btnSave').addEventListener('click', saveRecord);
document.getElementById('btnClearForm').addEventListener('click', clearForm);
document.getElementById('btnExport').addEventListener('click', exportCSV);
document.getElementById('btnClear').addEventListener('click', ()=>askPin('clear'));
document.getElementById('pinConfirm').addEventListener('click', confirmPin);
